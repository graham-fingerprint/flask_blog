{% extends "base.html" %}
{% block content %}
  <h2>Register</h2>
  <form id="registerForm" method="post">
    <label>Username: <input name="username" required></label><br>
    <label>Email: <input name="email" type="email" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>

<!-- Hidden fields populated by Fingerprint just before submit -->
    <input type="hidden" name="fp_visitorId">
    <input type="hidden" name="fp_requestId">
    <input type="hidden" name="fp_confidence">

    <button id="registerBtn" type="submit">Register</button>
  </form>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('registerBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      try {
        if (window.fpPromise) {
          const fp = await window.fpPromise;
          if (fp) {
            const result = await fp.get({ extendedResult: true, linkedId: "registration" });
            form.elements['fp_visitorId'].value = result.visitorId || "";
            form.elements['fp_requestId'].value = result.requestId || "";
            form.elements['fp_confidence'].value = (result.confidence && result.confidence.score) || "";
            console.log("FP OK:", result.visitorId, result.requestId, result.confidence?.score);
          } else {
            console.warn("fpPromise is null");
          }
        } else {
          console.warn("fpPromise is undefined");
        }
      } catch (err) {
        console.warn("Fingerprint get() failed:", err);
      } finally {
        form.submit();
      }
    });
  });
</script>  
<script type="module">
    (async () => {
      // Wait up to 5 seconds for fpPromise to be set by base.html loader
      const maxWaitMs = 5000;
      const start = performance.now();

      while (!window.fpPromise && performance.now() - start < maxWaitMs) {
        await new Promise(r => setTimeout(r, 50));
      }

      if (!window.fpPromise) {
        console.warn("FP debug: window.fpPromise never initialized (agent failed to load or script blocked).");
        return;
      }

      let fp;
      try {
        fp = await window.fpPromise;
      } catch (err) {
        console.warn("FP debug: fpPromise rejected:", err);
        return;
      }

      if (!fp || typeof fp.get !== "function") {
        console.warn("FP debug: fpPromise resolved to unexpected value:", fp);
        return;
      }

      try {
        const result = await fp.get({ extendedResult: true, linkedId: "registration-debug" });

        console.log("----- FP debug on /auth/register -----");
        console.log("Visitor ID:", result.visitorId);
        console.log("Request ID:", result.requestId);
        console.log("Confidence:", result.confidence?.score);
        console.log("Full result:", result);
        console.log("--------------------------------------");
      } catch (err) {
        console.warn("FP debug: fp.get() failed:", err);
      }
    })();
  </script>
{% endblock %}
